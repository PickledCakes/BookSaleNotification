name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile-check Python
        shell: pwsh
        run: |
          python -m py_compile app.py scraper.py

      - name: Build Windows app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean BookSaleNotification.spec

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "dev-${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create update ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist\Book Sale Notification" -DestinationPath "BookSaleNotification-Windows-$version.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookSaleNotification-Windows-${{ steps.version.outputs.version }}
          path: BookSaleNotification-Windows-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: BookSaleNotification-Windows-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
